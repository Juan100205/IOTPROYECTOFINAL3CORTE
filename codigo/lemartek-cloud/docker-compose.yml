# =====================================================================
#  LeMarTek Cloud for IoT - plataforma IoT de WaterGuard
#  ThingsBoard CE + puente MQTT sobre WebSockets + túnel de Cloudflare
#
#  Encender el túnel SOLO con ./encender_tunel.sh (exige aprovisionar antes).
#  NINGÚN puerto se publica en el host (Docker se salta ufw al publicar).
#  Nada se publica en los puertos del servidor: el único acceso desde
#  internet es el túnel de cloudflared (salida saliente, sin abrir
#  puertos en el router de la oficina).
#    https://IOT_HOST   -> ThingsBoard (tablero, usuarios, alarmas)
#    wss://MQTT_HOST    -> Mosquitto WS -> MQTT interno de ThingsBoard
# =====================================================================
name: lemartek-iot

services:
  thingsboard:
    image: thingsboard/tb-postgres:4.2.1
    restart: unless-stopped
    mem_limit: 3g
    logging: &log
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    environment:
      TB_QUEUE_TYPE: in-memory
      # Retención de telemetría: 90 días (limita la E/S y el tamaño de Postgres)
      SQL_TTL_TS_TS_KEY_VALUE_TTL: "7776000"
      SQL_TTL_EVENTS_EVENTS_TTL: "604800"
      JAVA_OPTS: "-Xms512M -Xmx1536M"
    volumes:
      - tb-data:/data
      - tb-logs:/var/log/thingsboard
    networks: [iot]

  mqtt-ws:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    mem_limit: 128m
    logging: *log
    depends_on: [thingsboard]
    # La config la genera provisionar.py; se copia con los permisos que exige Mosquitto 2
    command: >
      sh -c 'cp /cfg/mosquitto.conf /cfg/passwd /cfg/acl /mosquitto/config/ &&
             chown -R mosquitto:mosquitto /mosquitto/config /mosquitto/data &&
             chmod 0600 /mosquitto/config/passwd /mosquitto/config/acl &&
             exec mosquitto -c /mosquitto/config/mosquitto.conf'
    volumes:
      - ./mqtt-ws:/cfg:ro
      - mqtt-data:/mosquitto/data
    networks: [iot]

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    mem_limit: 128m
    logging: *log
    # El token se lee de un archivo (secret), no de una variable: así no
    # aparece en "docker inspect". Corre con el UID del dueño del archivo.
    user: "${UID_GID:-65532:65532}"
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    secrets: [tunnel_token]
    depends_on: [thingsboard, mqtt-ws]
    networks: [iot]
    profiles: [tunel]

secrets:
  tunnel_token:
    file: ./tunnel_token

volumes:
  tb-data:
  tb-logs:
  mqtt-data:

networks:
  iot:
